name: ShopMind AI - CI

on:
  push:
    branches:
      - dev
      - master
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  continuous-integration:
    name: Validate ShopMind AI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm -r --if-present lint

      - name: TypeScript validation
        run: pnpm -r --if-present typecheck

      - name: Run automated tests
        run: pnpm -r --if-present test
        env:
          CI: true

      - name: Build applications
        run: pnpm -r --if-present build

      - name: CI completed
        run: echo "ShopMind AI CI completed successfully"

  python-ci:
    name: Validate Python AI Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ai-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python dependencies
        run: python -m pip check

      - name: Run Ruff linting
        run: python -m ruff check .

      - name: Validate Python formatting
        run: python -m ruff format --check .

      - name: Run Python automated tests
        run: python -m pytest
        env:
          APP_ENV: test
          CI: "true"

      - name: Python CI completed
        run: echo "ShopMind AI Python CI completed successfully"

  deploy-development:
    name: Deploy DEV (Mock)
    needs:
      - continuous-integration
      - python-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/cd.yml
    with:
      environment: development

  deploy-production:
    name: Deploy PROD (Mock)
    needs:
      - continuous-integration
      - python-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/cd.yml
    with:
      environment: production